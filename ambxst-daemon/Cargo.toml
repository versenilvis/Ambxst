[package]
name = "ambxst-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
notify = "6"
zbus = { version = "3", features = ["tokio"] }
reqwest = { version = "0.11", features = ["json"] }
futures-util = "0.3"
percent-encoding = "2"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
md5 = "0.7"
